name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the public release smoke test after deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Permit an explicitly marked read-only diagnostic change without another build.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE }}
      GCP_ADMIN_SERVICE: ${{ vars.GCP_ADMIN_SERVICE || 'dealscout' }}
      GCP_IMAGE_REPOSITORY: ${{ vars.GCP_IMAGE_REPOSITORY }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_WEB_MAX_INSTANCES: ${{ vars.GCP_WEB_MAX_INSTANCES || '3' }}
      GCP_ADMIN_MAX_INSTANCES: ${{ vars.GCP_ADMIN_MAX_INSTANCES || '1' }}
      GCP_DATABASE_MODE: ${{ vars.GCP_DATABASE_MODE || 'cloudsql' }}
      GCP_RDS_DATABASE_SECRET: ${{ vars.GCP_RDS_DATABASE_SECRET }}
      GCP_RDS_CA_SECRET: ${{ vars.GCP_RDS_CA_SECRET }}
      GCP_DB_NETWORK: ${{ vars.GCP_DB_NETWORK }}
      GCP_DB_SUBNET: ${{ vars.GCP_DB_SUBNET }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
      DEAL_DATA_PROVIDER: ${{ vars.DEAL_DATA_PROVIDER }}
      RAINFOREST_DOMAIN: ${{ vars.RAINFOREST_DOMAIN }}
      RAINFOREST_DAILY_REQUEST_LIMIT: ${{ vars.RAINFOREST_DAILY_REQUEST_LIMIT }}
      RAINFOREST_MONTHLY_REQUEST_LIMIT: ${{ vars.RAINFOREST_MONTHLY_REQUEST_LIMIT }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_DAILY_REQUEST_LIMIT: ${{ vars.GEMINI_DAILY_REQUEST_LIMIT }}
      GEMINI_MONTHLY_REQUEST_LIMIT: ${{ vars.GEMINI_MONTHLY_REQUEST_LIMIT }}
      GCP_DB_SECRETS: ${{ vars.GCP_DB_SECRETS }}
      GCP_WEB_SECRETS: ${{ vars.GCP_WEB_SECRETS }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID GCP_REGION GCP_WEB_SERVICE GCP_ADMIN_SERVICE GCP_IMAGE_REPOSITORY
            PUBLIC_WEB_URL CORS_ORIGINS
            AMAZON_ASSOCIATE_TAG GCP_WEB_SECRETS
          )
          missing=()
          for key in "${required[@]}" GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing production configuration (${#missing[@]}):" >&2
            for key in "${missing[@]}"; do echo "- $key" >&2; done
            echo "Set these in the repository or its production environment; the two GCP identity entries are GitHub secrets." >&2
            exit 1
          fi
          node scripts/database-release.mjs validate
          for key in GCP_WEB_MAX_INSTANCES GCP_ADMIN_MAX_INSTANCES; do
            if ! [[ "${!key}" =~ ^([1-9]|1[0-9]|20)$ ]]; then
              echo "$key must be an integer from 1 to 20" >&2
              exit 1
            fi
          done
          case "$PUBLIC_WEB_URL" in https://*) ;; *) echo "PUBLIC_WEB_URL must use https://" >&2; exit 1 ;; esac
          if [ "$GCP_WEB_SERVICE" = "$GCP_ADMIN_SERVICE" ]; then
            echo "Public shopper and private admin must use different Cloud Run services." >&2
            exit 1
          fi

      - name: Run release quality gate
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build immutable production image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_IMAGE_REPOSITORY}:${GITHUB_SHA}"
          echo "GCP_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # The deployer can submit and inspect builds, but cannot stream default-bucket logs.
          BUILD_ID="$(gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --async \
            --format='value(id)' \
            --tag "$IMAGE" \
            .)"
          if [ -z "$BUILD_ID" ]; then
            echo "Cloud Build did not return a build ID." >&2
            exit 1
          fi
          echo "Cloud Build ID: $BUILD_ID"
          echo "Build details: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$GCP_PROJECT_ID"
          for attempt in {1..120}; do
            STATUS="$(gcloud builds describe "$BUILD_ID" \
              --project "$GCP_PROJECT_ID" \
              --format='value(status)')"
            case "$STATUS" in
              SUCCESS)
                echo "Cloud Build completed successfully."
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status $STATUS; inspect the build details URL above." >&2
                exit 1
                ;;
              PENDING|QUEUED|WORKING)
                echo "Cloud Build status: $STATUS (check $attempt/120)"
                ;;
              *)
                echo "Unexpected Cloud Build status: $STATUS" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Cloud Build did not finish within 20 minutes; inspect the build details URL above." >&2
          exit 1

      - name: Deploy Cloud Run web/API revision
        shell: bash
        run: |
          set -euo pipefail
          node scripts/database-release.mjs validate
          mapfile -t DB_ARGS < <(node scripts/database-release.mjs flags)
          DB_ENV="$(node scripts/database-release.mjs env)"
          DB_SECRETS="$(node scripts/database-release.mjs secrets)"
          PROVIDER="${DEAL_DATA_PROVIDER:-auto}"
          ENV_VARS="^|^NODE_ENV=production|PUBLIC_SURFACE_ONLY=true|PUBLIC_WEB_URL=${PUBLIC_WEB_URL}|CORS_ORIGINS=${CORS_ORIGINS}|${DB_ENV}|AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG}|DEAL_DATA_PROVIDER=${PROVIDER}"
          [ -n "${RAINFOREST_DOMAIN:-}" ] && ENV_VARS+="|RAINFOREST_DOMAIN=${RAINFOREST_DOMAIN}"
          [ -n "${RAINFOREST_DAILY_REQUEST_LIMIT:-}" ] && ENV_VARS+="|RAINFOREST_DAILY_REQUEST_LIMIT=${RAINFOREST_DAILY_REQUEST_LIMIT}"
          [ -n "${RAINFOREST_MONTHLY_REQUEST_LIMIT:-}" ] && ENV_VARS+="|RAINFOREST_MONTHLY_REQUEST_LIMIT=${RAINFOREST_MONTHLY_REQUEST_LIMIT}"
          [ -n "${GEMINI_MODEL:-}" ] && ENV_VARS+="|GEMINI_MODEL=${GEMINI_MODEL}"
          [ -n "${GEMINI_DAILY_REQUEST_LIMIT:-}" ] && ENV_VARS+="|GEMINI_DAILY_REQUEST_LIMIT=${GEMINI_DAILY_REQUEST_LIMIT}"
          [ -n "${GEMINI_MONTHLY_REQUEST_LIMIT:-}" ] && ENV_VARS+="|GEMINI_MONTHLY_REQUEST_LIMIT=${GEMINI_MONTHLY_REQUEST_LIMIT}"
          # Advance shared runtime settings with the image on both services.
          echo "GCP_COMMON_ENV=${ENV_VARS/|PUBLIC_SURFACE_ONLY=true/}" >> "$GITHUB_ENV"

          ARGS=(
            run deploy "$GCP_WEB_SERVICE"
            --project "$GCP_PROJECT_ID"
            --region "$GCP_REGION"
            --image "$GCP_IMAGE"
            --platform managed
            --allow-unauthenticated
            --min-instances 0 --max-instances "$GCP_WEB_MAX_INSTANCES"
            "${DB_ARGS[@]}"
            --set-env-vars "$ENV_VARS"
            --set-secrets "${DB_SECRETS},${GCP_WEB_SECRETS}"
            --quiet
          )
          if [ -n "${GCP_RUNTIME_SERVICE_ACCOUNT:-}" ]; then
            ARGS+=(--service-account "$GCP_RUNTIME_SERVICE_ACCOUNT")
          fi
          gcloud "${ARGS[@]}"

      - name: Deploy private admin revision
        shell: bash
        run: |
          set -euo pipefail
          # Preserve private IAM/IAP and all non-database admin configuration.
          ARGS=(run deploy "$GCP_ADMIN_SERVICE"
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION"
            --image "$GCP_IMAGE" --platform managed
            --min-instances 0 --max-instances "$GCP_ADMIN_MAX_INSTANCES"
            --update-env-vars "$GCP_COMMON_ENV" --quiet)
          if [ "${GCP_DATABASE_MODE:-cloudsql}" = "rds" ]; then
            node scripts/database-release.mjs validate
            mapfile -t DB_ARGS < <(node scripts/database-release.mjs flags)
            DB_ENV="$(node scripts/database-release.mjs env)"
            DB_SECRETS="$(node scripts/database-release.mjs secrets)"
            ARGS+=("${DB_ARGS[@]}" --remove-env-vars CLOUD_SQL_CONNECTION_NAME
              --remove-secrets DB_USER,DB_PASSWORD,DB_NAME --update-secrets "$DB_SECRETS")
            if [ -n "${GCP_RUNTIME_SERVICE_ACCOUNT:-}" ]; then
              ARGS+=(--service-account "$GCP_RUNTIME_SERVICE_ACCOUNT")
            fi
          fi
          gcloud "${ARGS[@]}"

      - name: Verify public and private image parity
        shell: bash
        run: |
          set -euo pipefail
          for service in "$GCP_WEB_SERVICE" "$GCP_ADMIN_SERVICE"; do
            gcloud run services describe "$service" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format=json | SERVICE_NAME="$service" node -e '
                let json = "";
                process.stdin.on("data", chunk => { json += chunk; });
                process.stdin.on("end", () => {
                  const service = JSON.parse(json);
                  const image = service.spec?.template?.spec?.containers?.[0]?.image;
                  const revision = service.status?.latestReadyRevisionName;
                  const traffic = service.status?.traffic || [];
                  if (image !== process.env.GCP_IMAGE || !revision ||
                      traffic.length !== 1 || Number(traffic[0].percent) !== 100 ||
                      traffic[0].revisionName !== revision) {
                    console.error(`${process.env.SERVICE_NAME} is not serving 100% of the expected image on its latest ready revision`);
                    process.exitCode = 1;
                    return;
                  }
                  console.log(`${process.env.SERVICE_NAME}: ${revision}, 100% traffic, ${image}`);
                });
              '
          done

      - name: Verify deployed revision
        if: ${{ github.event_name == 'push' || inputs.run_smoke }}
        env:
          DEALSCOUT_SMOKE_URL: ${{ vars.PUBLIC_WEB_URL }}
        run: npm run smoke:release

      - name: Deploy bounded maintenance job
        shell: bash
        run: |
          set -euo pipefail
          # Use the verified public runtime identity; no new credential or key.
          GCP_RUNTIME_SERVICE_ACCOUNT="$(gcloud run services describe "$GCP_WEB_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          export GCP_RUNTIME_SERVICE_ACCOUNT
          node scripts/maintenance-release.mjs

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### DealScout web deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${GCP_IMAGE}\`"
            echo "- Service: \`${GCP_WEB_SERVICE}\`"
            echo "- Private service: \`${GCP_ADMIN_SERVICE}\`"
            echo "- Region: \`${GCP_REGION}\`"
            echo "- Public URL: ${PUBLIC_WEB_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
