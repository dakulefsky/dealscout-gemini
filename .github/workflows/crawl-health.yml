name: Public crawl health
on:
  workflow_run:
    workflows: [Deploy Web]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - scripts/crawl-check.mjs
      - shared/dealCollections.json
      - shared/buyingGuide.json
      - shared/articles.json
      - shared/followContent.json
      - server/services/dealRssService.js
      - .github/workflows/crawl-health.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-crawl-health-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check public crawl access
        env:
          CRAWL_CHECK_ALLOW_UNPUBLISHED_GUIDES: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: node scripts/crawl-check.mjs
