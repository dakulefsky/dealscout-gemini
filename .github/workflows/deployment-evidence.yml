name: Read-only deployment evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/deployment-evidence.yml, scripts/deployment-evidence.mjs]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Report image, traffic and source-label evidence only
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE }}
          GCP_ADMIN_SERVICE: ${{ vars.GCP_ADMIN_SERVICE }}
        run: node scripts/deployment-evidence.mjs
