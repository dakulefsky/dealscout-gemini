name: Prepare mobile dependencies

on:
  push:
    branches:
      - app/expo-mobile-foundation

permissions:
  contents: write

jobs:
  mobile-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Expo-compatible persistent storage
        run: |
          cd apps/mobile
          if node -e "const p=require('./package.json'); process.exit(p.dependencies?.['expo-secure-store'] ? 0 : 1)"; then
            echo "expo-secure-store already installed"
          else
            npx expo install expo-secure-store
          fi
      - name: Commit dependency lock
        run: |
          if git diff --quiet -- apps/mobile/package.json apps/mobile/package-lock.json; then
            echo "Mobile dependencies already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json apps/mobile/package-lock.json
          git commit -m "Add secure mobile identity storage"
          git push
