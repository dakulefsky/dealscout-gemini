name: Generate mobile scaffold

on:
  push:
    branches:
      - app/expo-mobile-foundation

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate current stable Expo app
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "Mobile scaffold already exists"
            exit 0
          fi
          npx --yes create-expo-app@latest apps/mobile --yes
      - name: Commit generated scaffold
        run: |
          if git diff --quiet -- apps/mobile && git ls-files --error-unmatch apps/mobile/package.json >/dev/null 2>&1; then
            echo "Mobile scaffold is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          git commit -m "Generate Expo mobile scaffold"
          git push
