name: Read-only infrastructure inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/startup-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Collect permitted infrastructure evidence
        run: bash scripts/check-gcp-infrastructure.sh
