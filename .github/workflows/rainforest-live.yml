name: Rainforest Live Test

on:
  workflow_dispatch:
    inputs:
      asin:
        description: Amazon ASIN to verify
        required: false
        default: B0GGGQDY9H

permissions:
  contents: read

jobs:
  live-rainforest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      DEAL_DATA_PROVIDER: rainforest
      RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
      AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
      TEST_ASIN: ${{ inputs.asin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Rainforest live provider
        run: node scripts/test-rainforest-live.js
